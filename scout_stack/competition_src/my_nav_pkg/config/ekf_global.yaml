ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.10
    print_diagnostics: true
    debug: false
    publish_tf: false
    publish_acceleration: false
    predict_to_current_time: false
    reset_on_time_jump: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    twist0: /wheel/twist
    twist0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    twist0_queue_size: 10
    twist0_nodelay: true
    twist0_differential: false
    twist0_relative: false

    # Raw gyro only. yaw_sign belongs to the AHRS heading, not gyro-z.
    imu0: /imu/data
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 30
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false

    # Absolute yaw source selected by heading_selector:
    # - before first trusted COG: AHRS only for initialization
    # - turns: no absolute yaw message, gyro-z propagates yaw
    # - verified forward straights: RTK GNSS COG corrects absolute yaw
    imu1: /imu/heading_selected
    imu1_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    imu1_queue_size: 10
    imu1_nodelay: true
    imu1_differential: false
    imu1_relative: false
    imu1_remove_gravitational_acceleration: false

    # RTK-gated route-datum ENU base position. This must remain absolute.
    odom0: /odometry/gps_enu
    odom0_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom0_queue_size: 5
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
