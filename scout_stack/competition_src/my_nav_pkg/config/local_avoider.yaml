local_avoider_node:
  ros__parameters:
    # ROS contract: waypoint recorder/follower topics are unchanged.
    scan_topic: /scan
    odom_topic: /odometry/global
    pose_topic: /follower/control_pose
    hint_topic: /follower/debug/metrics
    path_target_topic: /follower/debug/target
    active_waypoint_topic: /follower/active_wp
    active_waypoint_timeout: 1.10
    require_obstacle_zone: true
    active_speed_cap_topic: /follower/active_speed_cap
    active_speed_cap_timeout: 0.35
    require_speed_cap: false
    cmd_topic: /cmd_vel/avoid
    active_topic: /avoid_active
    rate_hz: 20.0

    # Sensor diagnostics are fail-open. No ESTOP/SAFE_CREEP state exists.
    scan_stale_sec: 0.35
    odom_stale_sec: 0.35
    hint_stale_sec: 0.50
    scan_min_beams: 100
    scan_min_angular_span_deg: 190.0
    scan_min_usable_ratio: 0.50
    scan_front_half_angle_deg: 30.0
    scan_min_front_usable_ratio: 0.80
    laser_expected_frame: laser
    require_path_reference: false
    allow_single_target_fallback: true

    # Trigger and clustering.
    trigger_dist: 3.0
    trigger_confirm_scans: 3
    cluster_join_dist: 0.25
    cluster_min_points: 5
    cluster_min_extent: 0.08
    zone_exit_release_timeout_sec: 3.0

    # Official two-layout continuous C2 slalom.
    pattern_slalom_detection_dist: 5.0
    pattern_slalom_split_lateral: 0.625
    pattern_slalom_upper_pass_lateral: 0.00
    pattern_slalom_lower_pass_lateral: 1.25
    # 2.50 m clear face gap + 0.50 m box depth = 3.00 m centre spacing.
    pattern_slalom_obstacle_spacing: 3.00
    pattern_slalom_rejoin_distance: 3.00
    pattern_slalom_lookahead: 0.40
    pattern_slalom_curvature_preview: 0.10
    pattern_slalom_min_speed: 0.50
    pattern_slalom_max_speed: 0.70
    pattern_slalom_w_max: 1.00
    pattern_slalom_heading_gain: 2.50
    pattern_slalom_lateral_gain: 1.50
    pattern_slalom_yaw_response_gain: 1.31
    pattern_slalom_lateral_accel_limit: 0.60
    pattern_slalom_angular_utilization: 0.85
    pattern_slalom_linear_accel_limit: 0.70
    pattern_slalom_linear_decel_limit: 1.00
    pattern_slalom_verify_distance: 2.50
    pattern_slalom_verify_steps: 40
    avoid_unlocked_linear_cap: 0.50

    # Vehicle, obstacle and tracking geometry.
    avoid_tracking_margin: 0.025
    obstacle_width: 0.90
    obstacle_depth: 0.50
    track_merge_dist: 1.15
    track_confirm_scans: 3
    track_unconfirmed_ttl_sec: 0.60
    track_confirmed_ttl_sec: 2.00
    track_pass_recent_sec: 1.00
    track_same_scan_forward_merge: 0.70
    track_same_scan_lateral_merge: 1.10
    track_rear_limit: 2.20
    pass_margin: 2.00
    rejoin_lateral_tol: 0.20
    rejoin_yaw_tol_deg: 5.0

    # Measured LiDAR mounting and 200-degree usable FOV.
    laser_x_offset: 0.14
    laser_y_offset: 0.0
    laser_yaw_offset: 3.1416
    laser_fov_deg: 200.0
    blind_zone_memory_ttl_sec: 60.0
    blind_zone_memory_range_m: 6.0

    # Short pre-lock VFH validation. The locked path uses curvature tracking.
    avoid_target_slew_deg_per_s: 60.0
    avoid_near_obstacle_radius_m: 0.8
    avoid_max_target_angle_near_obstacle_deg: 30.0
    sector_deg: 5.0
    fov_deg: 100.0
    d_max: 2.20
    d_max_front: 3.50
    d_max_front_half_angle_deg: 40.0
    r_infl: 0.35
    hyst_w: 0.35
    corridor_weight: 1.20
    corridor_probe: 1.0
    usable_road_half: 1.35
    usable_road_left: 2.025
    usable_road_right: 0.675
    vehicle_length: 1.40
    vehicle_width: 0.65
    boundary_margin: 0.05
    safety_gap: 0.10
    verify_distance: 0.20
    verify_steps: 6
    max_retries: 12
    v_min: 0.08
    v_max: 0.54
    speed_distance_gain: 0.20
    w_max: 0.80

main_controller_node:
  ros__parameters:
    dry_run: false
    debug: true
    cmd_out: /cmd_vel
    follow_topic: /cmd_vel/follow
    avoid_topic: /cmd_vel/avoid
    avoid_active_topic: /avoid_active
    parking_topic: /cmd_vel/parking
    parking_active_topic: /parking_active
    mission_stop_topic: /control/state
    active_speed_cap_topic: /follower/active_speed_cap
    active_speed_cap_timeout: 0.35
    # speed-cap heartbeat 누락으로 최종 출력을 막지 않는다.
    require_speed_cap: false
    command_timeout: 0.40
    state_timeout: 0.60
    # /control/state가 항상 True/False를 주기적으로 발행하는 구성이 확정되면
    # true로 바꾸면 정지 신호 노드 단절도 fail-safe 정지로 처리한다.
    require_mission_heartbeat: false
    rate_hz: 20.0
    # FOLLOW는 launch의 follower linear_speed를, AVOID는 local_avoider의
    # v_max를 그대로 통과시켜야 한다. 여기가 최종 selector라 이 값이 낮으면
    # 상류에서 아무리 올려도 잘린다.
    # 2026-08-06: follower linear_speed가 0.25 -> 2.50 으로 올라간 뒤에도
    # 이 cap이 0.25로 남아 있어 mission:=true 로 띄우면 장애물이 없어도
    # 주행속도가 10분의 1로 잘리는 상태였다(mission:=false 직결 주행이라
    # 지금까지 드러나지 않았다). 상한이므로 여유를 두고 2.60으로 잡는다.
    follow_linear_cap: 2.60
    avoid_linear_cap: 0.70
    # 후진주차/후방센서 계약이 완성되기 전에는 최종 selector도 후진 차단.
    # 이 값은 일반 주행(FOLLOW/AVOID) 전용이며 계속 0.0으로 잠가 둔다.
    reverse_linear_cap: 0.0
    # 후진주차 전용 채널(/cmd_vel/parking + /parking_active). 이 소스로
    # 들어온 명령만 아래 상한으로 후진이 열린다 - reverse_linear_cap을
    # 건드리지 않고 주차 구간에서만 후진을 허용하기 위한 분리다.
    # follower의 주차 미션 상한 0.15m/s와 주차 노드의 전/후진 속도를 맞춘다.
    # parking_reverse_cap이 0.0이면 주차 노드가
    # 후진 명령을 내도 selector가 0으로 잘라 STRAIGHT_REVERSE에서 영구히
    # 멈춘다(주행거리가 안 늘어 종료조건이 전부 성립하지 않음) - 그래서
    # parking_controller_node에 stall 감지를 따로 뒀다.
    # 주의: 후방 라이다 사각(정후방 160도)은 여전하다. 이 후진은 슬롯 규격이
    # 미리 알려져 있고 진입 전 라이다로 위치를 확정한다는 전제 위에서만
    # 안전하며, 그 전제가 깨지는 코스에서는 다시 0.0으로 잠가야 한다.
    parking_linear_cap: 0.40
    parking_reverse_cap: 0.15
    angular_cap: 1.00
    # 2026-08-06: 0.30 m/s^2면 0 -> 2.50 도달에 8.3초가 걸려 출발/재가속이
    # 사실상 막힌다. 2026-08-05 주행 로그 실측 종방향 가감속 p90이 0.65라
    # 그에 맞춰 0.60으로 올린다(하드웨어가 실제로 내는 수준).
    linear_slew_rate: 0.60
    angular_slew_rate: 1.50
    slew_max_dt: 0.20

parking_controller_node:
  ros__parameters:
    # 후진주차 미션 노드. `/follower/active_wp` 라벨이 주차 구역일 때만 동작하고,
    # 그 밖에서는 parking_active=False + 0속도라 차량을 움직일 수 없다.
    scan_topic: /scan
    odom_topic: /odometry/global
    # 회피 노드와 동일하게 follower가 실제 사용한 map pose를 주차에도 쓴다.
    pose_topic: /follower/control_pose
    # pose_topic을 비울 때만 쓰는 단독 실행 fallback도 보정된 ENU heading이다.
    imu_topic: /imu/heading_enu
    cmd_topic: /cmd_vel/parking
    active_topic: /parking_active
    active_waypoint_topic: /follower/active_wp
    active_waypoint_timeout: 1.10
    # 주차 구역 밖에서 이 노드가 절대 움직이지 못하게 하는 게이트.
    # 이 값을 false로 두면 안 된다(후진 개방 조건과 직결).
    require_parking_zone: true
    active_speed_cap_topic: /follower/active_speed_cap
    active_speed_cap_timeout: 0.35
    require_speed_cap: true

    # ------------------------------------------------------------------
    # 차량/코스 규격. 차량 기준값은 local_avoider와 하나로 맞춘다.
    #
    # 교체 시 반드시 확인할 것:
    #  - lidar_offset_x : local_avoider의 laser_x_offset과 동일해야 한다.
    #  - vehicle_length : local_avoider의 vehicle_length와 동일해야 한다.
    #  - slot_on_left   : 진행방향 기준 주차 슬롯이 왼쪽인지. 갭 탐지 섹터
    #    방향과 회전 목표 자세가 통째로 뒤집히므로 코스 도면으로 확인할 것.
    #  - slot_back_boundary_y / side_box_front_y : 후진주차장 도면 치수.
    #  - row_near_dist / row_hold_dist : 차선에서 주차칸까지 거리에 의존한다.
    #    차선 위치가 바뀌면 같이 재계산해야 한다.
    # ------------------------------------------------------------------
    spec_confirmed: true
    # 2026-08-08: 0.60 -> 0.14. local_avoider의 laser_x_offset과 반드시 같아야 한다.
    lidar_offset_x: 0.14
    vehicle_length: 1.40
    slot_back_boundary_y: 1.6
    side_box_front_y: 0.10
    # 라이다가 정반대로 장착돼 있다. local_avoider의 laser_yaw_offset과 같은
    # 값이어야 하며, 없으면 주차 로직이 좌우를 뒤집어 판단한다.
    laser_yaw_offset: 3.1416
    # 박스가 좌우 어느 쪽에 놓이는지 매번 바뀌므로 라이다로 판정한다.
    # slot_on_left는 detect_slot_side가 false일 때의 fallback으로만 쓰인다.
    detect_slot_side: true
    slot_detect_confirm_scans: 5
    slot_on_left: true
    # 옆거리 = 차량 중심선(라이다 y offset 0) ~ 옆 칸 박스 앞면 수직거리.
    #   row_near_dist   이 안이면 "박스 옆", 밖이면 "빈 공간"(주차 시작 안 함)
    #   [min, max]      허용 밴드. 이 안이면 아무 보정도 하지 않는다.
    #                   벗어나야만 되돌리는 조향이 걸린다.
    #
    # 2026-08-16: 예전에는 row_hold_dist 0.75 하나로 "가까우면 밀어내기만" 하는
    # 편측 보정이었다. 그러면 0.75보다 가깝게 찍힌 경로는 실효 옆거리가 결국
    # 0.75로 밀려나고, 그 과정에서 차가 비스듬히 달린다(옆거리 0.5m에서 정상상태
    # 편향 8.6도). 밴드로 바꾸면 0.6~1.0 어디에 찍어도 그대로 유지된다.
    # Gazebo 검증: 옆거리 0.60 / 0.70 / 1.00 에서 폭오차가 모두 +28mm 로 동일.
    #
    # 후진거리 = 0.70 + 옆거리 다. 옆거리 1.0이면 1.70m 후진하므로,
    # parking_controller_node 의 후진 상한도 고정값에서 "목표 + 0.10m" 로
    # 함께 바뀌었다(REVERSE_OVERSHOOT_LIMIT).
    row_near_dist: 1.2
    row_hold_min: 0.6
    row_hold_max: 1.0
    # 미사용. 이 키가 든 기존 yaml 이 그대로 로드되도록 노드가 선언만 유지한다.
    row_hold_dist: 0.75
    # 기존 parking_bot 전용 피드포워드는 Scout 통합 pose에는 적용하지 않는다.
    rotate_scrub_drift: 0.0
    # 아래 속도는 크기(양수)로 준다. 방향은 상태머신이 정한다.
    speed_search: 0.40
    speed_back_to_center: 0.15
    speed_straight: 0.40
    speed_escape: 0.15
